<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1544 1600">
  <defs>
    <style>
      .tooltip-bg {
        fill: #0f172a;
        stroke: #38bdf8;
        stroke-width: 2;
        rx: 8;
      }
      .tooltip-title {
        fill: #ffffff;
        font-family: Arial, sans-serif;
        font-size: 28px;
        font-weight: bold;
      }
      .tooltip-desc {
        fill: #94a3b8;
        font-family: Arial, sans-serif;
        font-size: 22px;
      }
      .hotspot {
        fill: rgba(56, 189, 248, 0.25);
        stroke: #38bdf8;
        stroke-width: 4;
        stroke-dasharray: 6;
        cursor: pointer;
      }
    </style>
  </defs>

  <image xlink:href="carrito_parte_inferior.jpeg" x="0" y="0" width="1264" height="1600" />


  <!-- 1. Motor izquierdo -->
  <g class="interactive-group">
    <rect class="hotspot" x="740" y="320" width="200" height="470" rx="12" />
    <g class="tooltip">
      <rect class="tooltip-bg" x="720" y="230" width="350" height="100" />
      <text class="tooltip-title" x="740" y="265">Motor izquierdo</text>
      <text class="tooltip-desc" x="740" y="295">Controla la rueda izquierda.</text>
    </g>
  </g>

  <!-- 2. Rueda loca -->
  <g class="interactive-group">
    <rect class="hotspot" x="480" y="1200" width="250" height="250" rx="12" />
    <g class="tooltip">
      <rect class="tooltip-bg" x="440" y="1100" width="320" height="100" />
      <text class="tooltip-title" x="460" y="1135">Rueda loca</text>
      <text class="tooltip-desc" x="460" y="1165">Permite giros bruscos.</text>
    </g>
  </g>

  <!-- 3. Motor derecho -->
  <g class="interactive-group">
    <rect class="hotspot" x="250" y="320" width="200" height="470" rx="12" />
    <g class="tooltip">
      <rect class="tooltip-bg" x="250" y="230" width="350" height="100" />
      <text class="tooltip-title" x="270" y="265">Motor derecho</text>
      <text class="tooltip-desc" x="270" y="295">Controla la rueda derecha.</text>
    </g>
  </g>


</svg>
