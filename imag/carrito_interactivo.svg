<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1544 1600">
  <defs>
    <style>
      .hotspot {
        fill: rgba(56, 189, 248, 0.25);
        stroke: #38bdf8;
        stroke-width: 4;
        stroke-dasharray: 6;
        cursor: pointer;
      }
      .hotspot:hover {
        fill: rgba(56, 189, 248, 0.45);
        stroke: #00f0ff;
      }
    </style>
  </defs>

  <!-- URL ABSOLUTA RAW DE GITHUB + COMPATIBILIDAD XLINK -->
  <image 
    xlink:href="https://raw.githubusercontent.com/ant0305/Cartbot/main/imag/carrito_parte_superior.jpeg" 
    href="https://raw.githubusercontent.com/ant0305/Cartbot/main/imag/carrito_parte_superior.jpeg" 
    x="0" y="0" width="1544" height="1600" />

  <!-- 1. PORTAPILAS -->
  <g class="interactive-group">
    <title>Portapilas / Alimentación: Fuente de energía principal del sistema.</title>
    <rect class="hotspot" x="520" y="1130" width="530" height="270" rx="12" />
  </g>

  <!-- 2. REGULADOR -->
  <g class="interactive-group">
    <title>Convertidor DC-DC: Regulador de energía.</title>
    <rect class="hotspot" x="900" y="820" width="200" height="290" rx="12" />
  </g>

  <!-- 3. DRIVER DE MOTORES -->
  <g class="interactive-group">
    <title>Driver de Motores (L298N): Controlador Puente H para motores DC.</title>
    <rect class="hotspot" x="650" y="480" width="270" height="260" rx="12" />
  </g>

  <!-- 4. MICROCONTROLADOR -->
  <g class="interactive-group">
    <title>Microcontrolador ESP32: Crea la red wifi y ejecuta las indicaciones.</title>
    <rect class="hotspot" x="1020" y="230" width="180" height="180" rx="12" />
  </g>

</svg>
